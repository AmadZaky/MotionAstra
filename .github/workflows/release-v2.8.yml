name: Publish MotionAstra patch prerelease
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: motionastra-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get exact source revision
        shell: bash
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installers-windows.ps1
      - name: Verify macOS installer
        if: runner.os == 'macOS'
        run: |
          bash -n install-macos.command
          python3 tests/installers.py
  release:
    needs: installer-tests
    runs-on: ubuntu-latest
    steps:
      - name: Get exact source revision
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth=2 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify patch version
        run: python3 tools/check-version.py
      - name: Verify ExtendScript compatibility and packaging
        run: |
          npm install --no-save --package-lock=false acorn@8.15.0
          node tests/es3.cjs
          python3 tests/package.py
      - name: Verify host tests
        run: |
          for test in static engine expressions bridge tools checkboxes parser-boundary update-target background-create fx-target panel-state background-stability preview-idle loop-modes background-colors loop-migration features-282; do
            node "tests/$test.cjs"
          done
      - name: Verify browser workflow
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/ui.cjs
          node tests/checkbox-ui.cjs
      - name: Package extension
        run: python3 tools/package-release.py
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}-pre-alpha"
          asset="MotionAstra_FX_v${version}-pre-alpha.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            test "$existing" = "$SOURCE_SHA"
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$SOURCE_SHA" \
              --title "MotionAstra v${version} — Pre-alpha" --prerelease --notes-file RELEASE_NOTES.md
          fi
