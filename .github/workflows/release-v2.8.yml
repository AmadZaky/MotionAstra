name: Publish MotionAstra patch prerelease
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: motionastra-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get exact source revision
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth=2 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify patch version
        run: python3 tools/check-version.py
      - name: Verify host tests
        run: |
          for test in static engine expressions bridge tools checkboxes parser-boundary update-target background-create fx-target panel-state background-stability preview-idle loop-modes background-colors loop-migration; do
            node "tests/$test.cjs"
          done
      - name: Verify browser workflow
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/ui.cjs
          node tests/checkbox-ui.cjs
      - name: Package extension
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          version=Path('VERSION').read_text().strip()
          with zipfile.ZipFile('MotionAstra_FX_v'+version+'-pre-alpha.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  if name and not name.startswith('.github/'):
                      archive.write(name, 'MotionAstra-FX/' + name)
          PY
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}-pre-alpha"
          asset="MotionAstra_FX_v${version}-pre-alpha.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            test "$existing" = "$SOURCE_SHA"
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$SOURCE_SHA" \
              --title "MotionAstra v${version} — Pre-alpha" --prerelease --notes-file RELEASE_NOTES.md
          fi
